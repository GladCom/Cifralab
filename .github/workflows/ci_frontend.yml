name: Build Frontend

on:
  workflow_call:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        working-directory: ./src/Client
        run: npm ci --legacy-peer-deps
      - name: Lint
        working-directory: ./src/Client
        run: npx eslint src --ext .ts,.tsx,.js,.jsx --max-warnings=0
      - name: Build
        working-directory: ./src/Client
        env: { CI: false }
        run: npm run build
      - name: Test
        working-directory: ./src/Client
        env: { JEST_JUNIT_OUTPUT_DIR: ./ }
        run: npx jest --coverage --testResultsProcessor=jest-junit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: src/Client/coverage/
      - name: Upload JUnit
        uses: actions/upload-artifact@v4
        with:
          name: frontend-junit-${{ github.run_id }}
          path: src/Client/junit.xml